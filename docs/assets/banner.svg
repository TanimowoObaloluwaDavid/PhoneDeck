<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="PhoneDeck — your Android phone in a Windows window">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.55" stop-color="#0a0c0f"/>
      <stop offset="1" stop-color="#0b1218"/>
    </linearGradient>
    <radialGradient id="glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4f75c"/>
      <stop offset="0.55" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#63c11c"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0f3145"/>
      <stop offset="0.5" stop-color="#0c2637"/>
      <stop offset="1" stop-color="#07121c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="150" cy="40" r="320" fill="url(#glowLime)"/>
  <circle cx="1100" cy="60" r="340" fill="url(#glowTeal)"/>

  <!-- logo -->
  <g transform="translate(80 104)">
    <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#lime)"/>
    <g fill="none" stroke="#0b0e12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="29" y="18" width="26" height="48" rx="8"/>
      <path d="M38 24h8"/>
    </g>
    <circle cx="42" cy="58" r="3" fill="#0b0e12"/>
  </g>

  <!-- wordmark -->
  <text x="188" y="158" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#f2f5f7">PhoneDeck</text>

  <g transform="translate(188 178)">
    <rect x="0" y="0" width="76" height="26" rx="13" fill="none" stroke="#a3e635" stroke-opacity="0.55"/>
    <text x="38" y="18" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#a3e635">LOCAL</text>
  </g>

  <text x="278" y="197" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="21" fill="#8b95a1">Your Android phone, in a Windows window.</text>

  <!-- chips -->
  <g font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="14" fill="#9aa4b0">
    <g transform="translate(188 228)">
      <rect width="128" height="34" rx="17" fill="#12161b" stroke="#242a32"/>
      <text x="64" y="22" text-anchor="middle">Windows 10/11</text>
    </g>
    <g transform="translate(328 228)">
      <rect width="118" height="34" rx="17" fill="#12161b" stroke="#242a32"/>
      <text x="59" y="22" text-anchor="middle">Android 11+</text>
    </g>
    <g transform="translate(458 228)">
      <rect width="122" height="34" rx="17" fill="#12161b" stroke="#242a32"/>
      <text x="61" y="22" text-anchor="middle">No cloud</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(1002 34)">
    <rect x="0" y="0" width="190" height="292" rx="30" fill="#101317" stroke="#2a313a" stroke-width="2"/>
    <rect x="8" y="8" width="174" height="276" rx="24" fill="url(#phoneScreen)"/>
    <circle cx="95" cy="8" r="4" fill="#0a0c0f"/>
    <text x="28" y="52" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff" fill-opacity="0.92">9:41</text>
    <g fill="#ffffff" fill-opacity="0.5">
      <rect x="128" y="41" width="4" height="6" rx="2"/>
      <rect x="135" y="38" width="4" height="9" rx="2"/>
      <rect x="142" y="35" width="4" height="12" rx="2"/>
      <rect x="152" y="37" width="18" height="9" rx="3"/>
    </g>

    <text x="95" y="128" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="38" font-weight="700" fill="#ffffff" fill-opacity="0.95">9:41</text>
    <text x="95" y="150" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.55">Sun, 8 Nov · 23°</text>

    <g>
      <rect x="26" y="176" width="34" height="34" rx="10" fill="#38bdf8"/>
      <rect x="70" y="176" width="34" height="34" rx="10" fill="#fbbf24"/>
      <rect x="114" y="176" width="34" height="34" rx="10" fill="#34d399"/>
      <rect x="26" y="220" width="34" height="34" rx="10" fill="#a78bfa"/>
      <rect x="70" y="220" width="34" height="34" rx="10" fill="#f472b6"/>
      <rect x="114" y="220" width="34" height="34" rx="10" fill="#22d3ee"/>
    </g>

    <rect x="24" y="264" width="134" height="1" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="58" y="278" width="66" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <rect x="80" y="330" width="1120" height="1" fill="#ffffff" fill-opacity="0.06"/>
</svg>
